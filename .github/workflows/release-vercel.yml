name: Manual Vercel release

on:
  workflow_dispatch:
    inputs:
      commit_sha:
        description: Full 40-character commit SHA on protected main with successful CI
        required: true
        type: string
      environment:
        description: Separate pilot or production Vercel project
        required: true
        default: pilot
        type: choice
        options: [pilot, production]
      promote:
        description: Promote the verified staged candidate after environment approval
        required: true
        default: false
        type: boolean

permissions:
  contents: read
  actions: read

concurrency:
  group: vercel-release-${{ inputs.environment }}
  cancel-in-progress: false

env:
  RELEASE_SHA: ${{ inputs.commit_sha }}
  RELEASE_ENVIRONMENT: ${{ inputs.environment }}
  NEXT_TELEMETRY_DISABLED: "1"
  VERCEL_TELEMETRY_DISABLED: "1"
  VERCEL_CLI_USE_NATIVE_BINARY: "false"

jobs:
  validate:
    name: Validate immutable release source
    permissions:
      contents: read
      actions: read
      security-events: read
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      sha: ${{ steps.source.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false
      - id: source
        run: node scripts/ci-release.mjs source
        env:
          GH_TOKEN: ${{ github.token }}

  stage:
    name: Build and verify staged candidate
    needs: validate
    environment:
      name: ${{ inputs.environment }}
      url: ${{ steps.deploy.outputs.url }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: source
    outputs:
      url: ${{ steps.deploy.outputs.url }}
      artifact_sha: ${{ steps.artifact.outputs.artifact_sha }}
    env:
      DGITA_DEPLOYMENT_ENABLED: ${{ vars.DGITA_DEPLOYMENT_ENABLED }}
      DGITA_PRODUCTION_APPROVED: ${{ vars.DGITA_PRODUCTION_APPROVED }}
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.validate.outputs.sha }}
          persist-credentials: false
          path: source
      - name: Require configured and approved environment
        run: node "$GITHUB_WORKSPACE/scripts/ci-release.mjs" configuration
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      - run: npm ci
      - name: Install locked and patched deployment tools
        run: npm ci --prefix "$GITHUB_WORKSPACE/.github/deployment-tools" --ignore-scripts --no-fund
      - name: Audit the exact deployment toolchain before exposing credentials
        run: node "$GITHUB_WORKSPACE/scripts/ci-audit.mjs" "$GITHUB_WORKSPACE/.github/deployment-tools" "$GITHUB_WORKSPACE/.github/deployment-tools/audit-policy.json" "$GITHUB_WORKSPACE/work/ci/deployment-tools"
      - name: Verify overridden libraries and release command interfaces
        run: node --test "$GITHUB_WORKSPACE/scripts/ci-deployment-tools.test.mjs"
      - name: Fetch the selected project's production configuration
        run: '"$GITHUB_WORKSPACE/.github/deployment-tools/node_modules/.bin/vercel" pull --yes --environment=production --token="$VERCEL_TOKEN"'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      - name: Check pilot/production isolation and required application settings
        run: node "$GITHUB_WORKSPACE/scripts/ci-release.mjs" application-environment
      - name: Build the deployable production artifact
        run: '"$GITHUB_WORKSPACE/.github/deployment-tools/node_modules/.bin/vercel" build --prod'
      - id: artifact
        name: Record the immutable output digest
        run: node "$GITHUB_WORKSPACE/scripts/ci-release.mjs" artifact
      - id: deploy
        name: Deploy this exact artifact without changing live domains
        run: |
          deployment_url=$("$GITHUB_WORKSPACE/.github/deployment-tools/node_modules/.bin/vercel" deploy --prebuilt --prod --skip-domain --yes --token="$VERCEL_TOKEN" --meta "dgitaSourceSha=$RELEASE_SHA" --meta "dgitaArtifactSha=$ARTIFACT_SHA" --meta "dgitaWorkflowRun=$GITHUB_RUN_ID" --meta "dgitaEnvironment=$RELEASE_ENVIRONMENT")
          printf 'url=%s\n' "$deployment_url" >> "$GITHUB_OUTPUT"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          ARTIFACT_SHA: ${{ steps.artifact.outputs.artifact_sha }}
      - name: Verify candidate identity and externally test the candidate
        run: node "$GITHUB_WORKSPACE/scripts/ci-release.mjs" smoke
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.url }}
          ARTIFACT_SHA: ${{ steps.artifact.outputs.artifact_sha }}
      - name: Remove pulled environment files from the runner
        if: always()
        run: rm -f .vercel/.env.production.local

  promote:
    name: Approve and promote the verified candidate
    permissions:
      contents: read
      actions: read
      security-events: read
    if: inputs.promote
    needs: [validate, stage]
    environment:
      name: ${{ inputs.environment }}
      url: ${{ needs.stage.outputs.url }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      DGITA_DEPLOYMENT_ENABLED: ${{ vars.DGITA_DEPLOYMENT_ENABLED }}
      DGITA_PRODUCTION_APPROVED: ${{ vars.DGITA_PRODUCTION_APPROVED }}
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
      DEPLOYMENT_URL: ${{ needs.stage.outputs.url }}
      ARTIFACT_SHA: ${{ needs.stage.outputs.artifact_sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false
      - name: Recheck source and CI after approval
        run: node scripts/ci-release.mjs source
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Recheck exact project, SHA, output digest and staged target
        run: node scripts/ci-release.mjs deployment
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      - name: Install locked and patched deployment tools
        run: npm ci --prefix "$GITHUB_WORKSPACE/.github/deployment-tools" --ignore-scripts --no-fund
      - name: Verify locked toolchain audit and compatibility
        run: |
          node scripts/ci-audit.mjs .github/deployment-tools .github/deployment-tools/audit-policy.json work/ci/deployment-tools
          node --test scripts/ci-deployment-tools.test.mjs
      - name: Promote without rebuilding the artifact
        run: '"$GITHUB_WORKSPACE/.github/deployment-tools/node_modules/.bin/vercel" promote "$DEPLOYMENT_URL" --yes --timeout=5m --token="$VERCEL_TOKEN"'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
