name: Quality gates

on:
  pull_request:
  push:
    branches: [main]
  merge_group:
  workflow_dispatch:
  schedule:
    - cron: "17 5 * * 1"

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: "1"
  WRANGLER_SEND_METRICS: "false"

jobs:
  verify:
    name: Lint, types and regression tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - name: Build worker and run unit and database integration tests
        run: npm test

  production:
    name: Next production build and complete workflow
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build:next
      - run: node scripts/ci-server.mjs production
      - name: Complete case lifecycle on the Next production build with local provider fixtures
        run: npm run test:ci:next-e2e
      - name: Retain synthetic smoke evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: production-smoke-${{ github.run_attempt }}
          path: |
            work/ci/production/
            work/ci/next-e2e/
          if-no-files-found: ignore
          retention-days: 7

  e2e:
    name: Isolated application workflow
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run test:ci:e2e
      - name: Retain synthetic workflow evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: application-workflow-${{ github.run_attempt }}
          path: work/ci/e2e/
          if-no-files-found: ignore
          retention-days: 7

  dependencies:
    name: Dependency audit and SBOM
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: mkdir -p work/ci/dependencies
      - name: Produce full dependency inventory
        run: npm sbom --sbom-format=cyclonedx > work/ci/dependencies/sbom.cdx.json
      - name: Verify audit policy rejects new, production and expired findings
        run: node --test scripts/ci-audit.test.mjs
      - name: Enforce production audit and time-limited development exceptions
        run: node scripts/ci-audit.mjs
      - name: Retain dependency evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: dependency-evidence-${{ github.run_attempt }}
          path: work/ci/dependencies/
          if-no-files-found: ignore
          retention-days: 14

  deployment-tools:
    name: Deployment toolchain audit and compatibility
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: .github/deployment-tools/package-lock.json
      - run: npm ci --prefix .github/deployment-tools --ignore-scripts --no-fund
      - run: node scripts/ci-audit.mjs .github/deployment-tools .github/deployment-tools/audit-policy.json work/ci/deployment-tools
      - run: node --test scripts/ci-deployment-tools.test.mjs
      - run: npm sbom --prefix .github/deployment-tools --sbom-format=cyclonedx > work/ci/deployment-tools/sbom.cdx.json
      - name: Retain deployment toolchain evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: deployment-toolchain-${{ github.run_attempt }}
          path: work/ci/deployment-tools/
          if-no-files-found: ignore
          retention-days: 14

  secrets:
    name: Secret scan
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          package-manager-cache: false
      - run: node scripts/ci-download-tool.mjs gitleaks
      - name: Scan complete reachable history without disclosing findings
        run: work/ci-tools/gitleaks git --redact --no-banner --log-opts="--all"
      - name: Scan checked-out files, including the proposed merge
        run: work/ci-tools/gitleaks dir --redact --no-banner .

  workflow:
    name: Workflow validation
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          package-manager-cache: false
      - run: node scripts/ci-download-tool.mjs actionlint
      - run: work/ci-tools/actionlint
      - name: Verify release guards reject untrusted source and candidates
        run: node --test scripts/ci-release.test.mjs

  dependency-review:
    name: Dependency change review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48 # v4
        with:
          fail-on-severity: high
          comment-summary-in-pr: never

  codeql:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript, actions]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          queries: security-extended
      - uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4
        with:
          category: /language:${{ matrix.language }}

  quality-gate:
    name: Required quality gate
    if: always()
    needs: [verify, production, e2e, dependencies, deployment-tools, secrets, workflow, dependency-review, codeql]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    permissions: {}
    env:
      NEEDS_RESULTS: ${{ toJSON(needs) }}
      EVENT_NAME: ${{ github.event_name }}
    steps:
      - name: Require every applicable check to succeed
        run: |
          python3 - <<'PY'
          import json
          import os
          import sys
          results = json.loads(os.environ["NEEDS_RESULTS"])
          failures = []
          for name, job in results.items():
              allowed = {"success"}
              if name == "dependency-review" and os.environ["EVENT_NAME"] != "pull_request":
                  allowed.add("skipped")
              if job["result"] not in allowed:
                  failures.append(f"{name}: {job['result']}")
          if failures:
              print("Required checks failed: " + ", ".join(failures))
              sys.exit(1)
          print("All applicable quality gates passed.")
          PY
